name: Generate Auto Call Assistant APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Generate Pure Android Java Project
        run: |
          mkdir -p app/src/main/java/com/aicall/assistant
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 0. Gradle Properties (AndroidX Enable)
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 1. Root Build Gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
              }
          }
          EOF

          # 2. Settings Gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AICallAssistant"
          include ':app'
          EOF

          # 3. App Build Gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.aicall.assistant'
              compileSdk 33
              defaultConfig {
                  applicationId "com.aicall.assistant"
                  minSdk 26
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # 4. Android Manifest
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.aicall.assistant">

              <uses-permission android:name="android.permission.READ_PHONE_STATE"/>
              <uses-permission android:name="android.permission.READ_CALL_LOG"/>
              <uses-permission android:name="android.permission.ANSWER_PHONE_CALLS"/>
              <uses-permission android:name="android.permission.MANAGE_OWN_CALLS"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>

              <application
                  android:allowBackup="true"
                  android:label="AI Call Assistant"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">

                  <activity android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".CustomCallScreeningService"
                      android:permission="android.permission.BIND_SCREENING_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.telecom.CallScreeningService" />
                      </intent-filter>
                  </service>

              </application>
          </manifest>
          EOF

          # 5. MainActivity Java File (Fixed Role & UI Update)
          cat << 'EOF' > app/src/main/java/com/aicall/assistant/MainActivity.java
          package com.aicall.assistant;

          import android.app.role.RoleManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import java.util.HashSet;
          import java.util.Set;

          public class MainActivity extends AppCompatActivity {
              private TextView tvSavedNumbers;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  tvSavedNumbers = findViewById(R.id.tvSavedNumbers);
                  loadSavedNumbers();
                  requestCallScreeningRole(); // ✅ FIXED: Call Screening Role

                  EditText etNumber = findViewById(R.id.etPhoneNumber);
                  Button btnAdd = findViewById(R.id.btnAddNumber);

                  btnAdd.setOnClickListener(v -> {
                      String num = etNumber.getText().toString().trim();
                      if (!num.isEmpty()) {
                          SharedPreferences prefs = getSharedPreferences("AI_CALL_PREFS", Context.MODE_PRIVATE);
                          Set<String> set = prefs.getStringSet("AI_NUMBERS", new HashSet<>());
                          Set<String> newSet = new HashSet<>(set);
                          newSet.add(num);
                          prefs.edit().putStringSet("AI_NUMBERS", newSet).apply();
                          Toast.makeText(this, "Number Added!", Toast.LENGTH_SHORT).show();
                          etNumber.setText("");
                          loadSavedNumbers();
                      }
                  });
              }

              private void loadSavedNumbers() {
                  SharedPreferences prefs = getSharedPreferences("AI_CALL_PREFS", Context.MODE_PRIVATE);
                  Set<String> set = prefs.getStringSet("AI_NUMBERS", new HashSet<>());
                  if (set.isEmpty()) {
                      tvSavedNumbers.setText("No numbers added yet.");
                  } else {
                      tvSavedNumbers.setText("Saved Numbers:\n" + String.join("\n", set));
                  }
              }

              private void requestCallScreeningRole() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      RoleManager roleManager = getSystemService(RoleManager.class);
                      if (roleManager != null && !roleManager.isRoleHeld(RoleManager.ROLE_CALL_SCREENING)) {
                          Intent intent = roleManager.createRequestRoleIntent(RoleManager.ROLE_CALL_SCREENING);
                          startActivityForResult(intent, 1001);
                      }
                  }
              }
          }
          EOF

          # 6. Call Screening Service Java File
          cat << 'EOF' > app/src/main/java/com/aicall/assistant/CustomCallScreeningService.java
          package com.aicall.assistant;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Build;
          import android.telecom.Call;
          import android.telecom.CallScreeningService;
          import androidx.annotation.RequiresApi;
          import java.util.HashSet;
          import java.util.Set;

          @RequiresApi(api = Build.VERSION_CODES.N)
          public class CustomCallScreeningService extends CallScreeningService {
              @Override
              public void onScreenCall(Call.Details callDetails) {
                  Uri handle = callDetails.getHandle();
                  String rawNumber = handle != null ? handle.getSchemeSpecificPart() : "";

                  SharedPreferences prefs = getSharedPreferences("AI_CALL_PREFS", Context.MODE_PRIVATE);
                  Set<String> aiNumbers = prefs.getStringSet("AI_NUMBERS", new HashSet<>());

                  boolean isAiTarget = false;
                  for (String num : aiNumbers) {
                      if (rawNumber.contains(num)) {
                          isAiTarget = true;
                          break;
                      }
                  }

                  CallResponse.Builder response = new CallResponse.Builder();
                  if (isAiTarget) {
                      response.setSilenceCall(true); // Call ko silent karega
                  }
                  respondToCall(callDetails, response.build());
              }
          }
          EOF

          # 7. Layout Main XML (Updated UI)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="24dp">

              <EditText
                  android:id="@+id/etPhoneNumber"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="Enter Number to Silence Call"
                  android:inputType="phone"/>

              <Button
                  android:id="@+id/btnAddNumber"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="16dp"
                  android:text="Add to AI Screening List"/>

              <TextView
                  android:id="@+id/tvSavedNumbers"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="24dp"
                  android:textSize="16sp"
                  android:text="No numbers added yet."/>
          </LinearLayout>
          EOF

          # 8. Strings XML
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">AI Call Assistant</string>
          </resources>
          EOF

          # 9. Setup Gradle Wrapper
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Call-Assistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk
